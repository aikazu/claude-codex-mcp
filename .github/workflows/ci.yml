name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: CLI smoke test
        run: node src/cli.mjs --version
      - name: Installer dry run (fake Codex)
        shell: bash
        env:
          CODEX_BIN: ${{ github.workspace }}/test/fixtures/fake-codex.mjs
        run: node scripts/register.mjs --dry-run

  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: install.ps1 under Windows PowerShell 5.1
        shell: powershell
        env:
          CODEX_BIN: ${{ github.workspace }}\test\fixtures\fake-codex.mjs
        run: .\scripts\install.ps1 -DryRun

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate ./.claude-plugin/plugin.json
